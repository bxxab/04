<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>مدينة وهمية 3D</title>
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#9ad0f5;touch-action:manipulation;
    -webkit-user-select:none;user-select:none;-webkit-touch-callout:none;
    -webkit-tap-highlight-color:transparent;font-family:system-ui,sans-serif}
  canvas{display:block;touch-action:none}
  #hint{position:fixed;top:12px;left:0;right:0;text-align:center;color:#fff;
    font-size:14px;text-shadow:0 1px 4px #000a;pointer-events:none}
  #joy{position:fixed;left:24px;bottom:28px;width:130px;height:130px;border-radius:50%;
    background:#ffffff33;border:2px solid #ffffff88;touch-action:none}
  #knob{position:absolute;left:50%;top:50%;width:56px;height:56px;margin:-28px 0 0 -28px;
    border-radius:50%;background:#ffffffcc;pointer-events:none}
</style>
</head>
<body>
<div id="hint">الجويستك للمشي • اسحب الشاشة لتدوير الكاميرا • اقرص للتقريب</div>
<div id="joy"><div id="knob"></div></div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script>
// ---------- أدوات ----------
const rand=(()=>{let a=7;return()=>{a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);
  t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}})();
const rr=(a,b)=>a+rand()*(b-a);
const pick=arr=>arr[Math.floor(rand()*arr.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));

// ---------- المشهد ----------
const scene=new THREE.Scene();
scene.background=new THREE.Color(0x9ad0f5);
scene.fog=new THREE.Fog(0x9ad0f5,120,420);
const camera=new THREE.PerspectiveCamera(55,innerWidth/innerHeight,0.1,1000);
const renderer=new THREE.WebGLRenderer({antialias:true});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const cv=renderer.domElement;

scene.add(new THREE.HemisphereLight(0xffffff,0x6b8f6b,0.9));
const sun=new THREE.DirectionalLight(0xfff2d6,0.8);
sun.position.set(70,110,50);
sun.castShadow=true;
sun.shadow.mapSize.set(2048,2048);
Object.assign(sun.shadow.camera,{left:-110,right:110,top:110,bottom:-110,near:10,far:350});
scene.add(sun);

// ---------- مواد مشتركة ----------
const lampMat=new THREE.MeshBasicMaterial({color:0xcccccc});
const glassMat=new THREE.MeshLambertMaterial({color:0x2a3b52});
const sidewalkM=new THREE.MeshLambertMaterial({color:0xb9bcc0});
const roadM=new THREE.MeshLambertMaterial({color:0x3a3f47});

// ---------- نوافذ المباني ----------
function makeWindowSet(){
  const S=128,n=4,c=S/n;
  const base=document.createElement('canvas');
  base.width=base.height=S;
  const b=base.getContext('2d');
  b.fillStyle='#e8e4dc';b.fillRect(0,0,S,S);
  for(let i=0;i<n;i++)for(let j=0;j<n;j++){
    b.fillStyle=rand()<0.5?'#4f77a8':'#5d86b8';
    b.fillRect(i*c+5,j*c+6,c-10,c-12);
  }
  return base;
}
const sets=[makeWindowSet(),makeWindowSet(),makeWindowSet()];
function mk(canvas,rx,ry){
  const t=new THREE.CanvasTexture(canvas);
  t.wrapS=t.wrapT=THREE.RepeatWrapping;
  t.repeat.set(rx,ry);t.offset.set(rand(),rand());
  return t;
}
function sideMat(set,rx,ry,color){
  return new THREE.MeshLambertMaterial({color,map:mk(set,rx,ry)});
}

// ---------- مبنى ----------
const roofM=new THREE.MeshLambertMaterial({color:0x777f88});
const acG=new THREE.BoxGeometry(1.2,0.8,1.2);
function addBuilding(parent,x,z,w,d,h,y0=0,stepped=false){
  const set=pick(sets);
  const color=new THREE.Color().setHSL(rand(),0.18,rr(0.6,0.85));
  const mx=sideMat(set,d/8,h/8,color),mz=sideMat(set,w/8,h/8,color);
  const m=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),[mx,mx,roofM,roofM,mz,mz]);
  m.position.set(x,y0+h/2,z);
  m.castShadow=m.receiveShadow=true;
  m.userData.solid=true;
  parent.add(m);
  if(stepped&&h>12){
    addBuilding(parent,x,z,w*0.62,d*0.62,h*0.35,y0+h,false);
    return;
  }
  for(let i=0;i<2;i++){
    const ac=new THREE.Mesh(acG,roofM);
    ac.position.set(x+rr(-w/3,w/3),y0+h+0.4,z+rr(-d/3,d/3));
    ac.castShadow=true;parent.add(ac);
  }
  if(h>24){
    const a=new THREE.Mesh(new THREE.CylinderGeometry(0.06,0.06,5,6),roofM);
    a.position.set(x,y0+h+2.5,z);parent.add(a);
  }
}

// ---------- أشجار ----------
const trunkG=new THREE.CylinderGeometry(0.18,0.26,1.6,6);
const coneG=new THREE.ConeGeometry(1.5,3,8);
const ballG=new THREE.IcosahedronGeometry(1.5,0);
const trunkM=new THREE.MeshLambertMaterial({color:0x6b4a2f});
const leafMs=[0x3f9e4d,0x58b35a,0x2f8a46,0x6cc04a].map(c=>new THREE.MeshLambertMaterial({color:c,flatShading:true}));
function tree(parent,x,z,s=1){
  const g=new THREE.Group();g.position.set(x,0,z);g.scale.setScalar(s);
  const t=new THREE.Mesh(trunkG,trunkM);t.position.y=0.8;t.castShadow=true;
  t.userData.tree=true;g.add(t);
  const cone=rand()<0.5;
  const f=new THREE.Mesh(cone?coneG:ballG,pick(leafMs));
  f.position.y=cone?3.1:2.6;f.castShadow=true;g.add(f);
  parent.add(g);
}

// ---------- مجموعة المدينة ----------
const N=5,B=20,P=28;
const city=new THREE.Group();scene.add(city);
const roadCenters=[];for(let k=0;k<=N;k++)roadCenters.push((k-N/2)*P);

// أرض وشوارع
const grass=new THREE.Mesh(new THREE.PlaneGeometry(1200,1200),new THREE.MeshLambertMaterial({color:0x6fbf73}));
grass.rotation.x=-Math.PI/2;grass.position.y=-0.05;grass.receiveShadow=true;scene.add(grass);
const road=new THREE.Mesh(new THREE.PlaneGeometry(148,148),roadM);
road.rotation.x=-Math.PI/2;road.receiveShadow=true;scene.add(road);

// خطوط الشارع
const dashes=[];
roadCenters.forEach(rc=>{
  for(let t=-72;t<=72;t+=6){
    if(roadCenters.some(o=>Math.abs(t-o)<5.5))continue;
    dashes.push([rc,t,0]);
    dashes.push([t,rc,Math.PI/2]);
  }
});
const dashMesh=new THREE.InstancedMesh(new THREE.BoxGeometry(0.25,0.02,2.2),
  new THREE.MeshBasicMaterial({color:0xf2f2f2}),dashes.length);
const o=new THREE.Object3D();
dashes.forEach((d,i)=>{o.position.set(d[0],0.03,d[1]);o.rotation.set(0,d[2],0);o.updateMatrix();dashMesh.setMatrixAt(i,o.matrix);});
scene.add(dashMesh);

// ---------- كوفي ----------
function stripeTex(){
  const c=document.createElement('canvas');c.width=128;c.height=8;
  const x=c.getContext('2d');
  for(let i=0;i<8;i++){x.fillStyle=i%2?'#ffffff':'#d94b4b';x.fillRect(i*16,0,16,8);}
  const t=new THREE.CanvasTexture(c);t.wrapS=THREE.RepeatWrapping;t.repeat.set(2,1);return t;
}
function signTex(){
  const c=document.createElement('canvas');c.width=512;c.height=108;
  const x=c.getContext('2d');
  x.fillStyle='#3b2a20';x.fillRect(0,0,512,108);
  x.strokeStyle='#e8b04a';x.lineWidth=5;x.strokeRect(6,6,500,96);
  x.fillStyle='#ffd27a';x.textAlign='center';x.textBaseline='middle';
  x.font='bold 54px system-ui,sans-serif';
  x.fillText('COFFEE',150,56);x.fillText('قهوة',380,56);
  return new THREE.CanvasTexture(c);
}
const umbrellaCols=[0xe74c3c,0xf1c40f,0x3498db,0x2ecc71,0xe67e22];
function cafeBlock(parent){
  const g=new THREE.Group();g.rotation.y=Math.floor(rand()*4)*Math.PI/2;parent.add(g);
  const wall=new THREE.Mesh(new THREE.BoxGeometry(14,4.8,7),
    new THREE.MeshLambertMaterial({color:pick([0xd9a066,0xc97b63,0xe6c78f,0x9bb7a0])}));
  wall.position.set(0,2.4,-6);wall.castShadow=wall.receiveShadow=true;
  wall.userData.solid=true;g.add(wall);
  const roof=new THREE.Mesh(new THREE.BoxGeometry(14.6,0.3,7.6),new THREE.MeshLambertMaterial({color:0x6b4a3a}));
  roof.position.set(0,4.95,-6);roof.castShadow=true;g.add(roof);
  const door=new THREE.Mesh(new THREE.BoxGeometry(1.8,2.8,0.12),new THREE.MeshLambertMaterial({color:0x5a3d2b}));
  door.position.set(0,1.4,-2.44);g.add(door);
  const glass=new THREE.MeshLambertMaterial({color:0x9fd3e8});
  [-4,4].forEach(x=>{const w=new THREE.Mesh(new THREE.BoxGeometry(3.6,2,0.12),glass);w.position.set(x,1.9,-2.44);g.add(w);});
  const awn=new THREE.Mesh(new THREE.BoxGeometry(12,0.15,2.6),new THREE.MeshLambertMaterial({map:stripeTex()}));
  awn.position.set(0,3.6,-1.2);awn.rotation.x=0.25;awn.castShadow=true;g.add(awn);
  const signM=new THREE.MeshLambertMaterial({map:signTex()});
  const dark=new THREE.MeshLambertMaterial({color:0x2b1d14});
  const sign=new THREE.Mesh(new THREE.BoxGeometry(7,1.5,0.3),[dark,dark,dark,dark,signM,dark]);
  sign.position.set(0,5.9,-3.2);sign.castShadow=true;g.add(sign);
  const pave=new THREE.Mesh(new THREE.BoxGeometry(14,0.06,8),new THREE.MeshLambertMaterial({color:0xcdbba0}));
  pave.position.set(0,0.03,2);pave.receiveShadow=true;g.add(pave);
  const tableM=new THREE.MeshLambertMaterial({color:0xf5f0e6});
  const woodM=new THREE.MeshLambertMaterial({color:0x5a3d2b});
  [-4.5,0,4.5].forEach(tx=>[1.2,4.6].forEach(tz=>{
    const t=new THREE.Group();t.position.set(tx,0,tz);
    const top=new THREE.Mesh(new THREE.CylinderGeometry(0.65,0.65,0.08,16),tableM);top.position.y=1;
    const leg=new THREE.Mesh(new THREE.CylinderGeometry(0.07,0.07,1,8),woodM);leg.position.y=0.5;
    t.add(top,leg);
    if(rand()<0.7){
      const pole=new THREE.Mesh(new THREE.CylinderGeometry(0.04,0.04,2.4,6),woodM);pole.position.y=1.2;
      const um=new THREE.Mesh(new THREE.ConeGeometry(1.5,0.55,12),new THREE.MeshLambertMaterial({color:pick(umbrellaCols)}));
      um.position.y=2.55;um.castShadow=true;t.add(pole,um);
    }
    [-1,1].forEach(s=>{const sl=new THREE.Mesh(new THREE.CylinderGeometry(0.28,0.28,0.5,10),woodM);sl.position.set(s,0.25,0);t.add(sl);});
    g.add(t);
  }));
  tree(g,-8.5,3,0.7);tree(g,8.5,3,0.7);
}

// ---------- حديقة ----------
function parkBlock(parent){
  const grassBox=new THREE.Mesh(new THREE.BoxGeometry(18,0.15,18),new THREE.MeshLambertMaterial({color:0x5fb85a}));
  grassBox.position.y=0.075;grassBox.receiveShadow=true;parent.add(grassBox);
  const pathM=new THREE.MeshLambertMaterial({color:0xd9c9a3});
  const p1=new THREE.Mesh(new THREE.BoxGeometry(18,0.17,2),pathM);p1.position.y=0.085;
  const p2=new THREE.Mesh(new THREE.BoxGeometry(2,0.17,18),pathM);p2.position.y=0.085;
  p1.receiveShadow=p2.receiveShadow=true;parent.add(p1,p2);
  // نافورة
  const basin=new THREE.Mesh(new THREE.CylinderGeometry(2,2.2,0.5,24),new THREE.MeshLambertMaterial({color:0xcfd3d8}));
  basin.position.y=0.35;basin.userData.solid=true;
  const water=new THREE.Mesh(new THREE.CylinderGeometry(1.7,1.7,0.52,24),new THREE.MeshLambertMaterial({color:0x4aa8d8}));
  water.position.y=0.36;
  const col=new THREE.Mesh(new THREE.CylinderGeometry(0.25,0.3,1.6,10),new THREE.MeshLambertMaterial({color:0xcfd3d8}));
  col.position.y=1.1;
  const top=new THREE.Mesh(new THREE.SphereGeometry(0.5,12,10),new THREE.MeshLambertMaterial({color:0x4aa8d8}));
  top.position.y=2;
  basin.castShadow=col.castShadow=true;
  parent.add(basin,water,col,top);
  // بركة
  const px=pick([-1,1])*5.4,pz=pick([-1,1])*5.4;
  const pond=new THREE.Mesh(new THREE.CylinderGeometry(3,3,0.17,28),new THREE.MeshLambertMaterial({color:0x4aa8d8}));
  pond.position.set(px,0.085,pz);parent.add(pond);
  // أشجار
  let placed=0,tries=0;
  while(placed<11&&tries<80){
    tries++;
    const x=rr(-8.3,8.3),z=rr(-8.3,8.3);
    if(Math.abs(x)<2.4||Math.abs(z)<2.4)continue;
    if(Math.hypot(x-px,z-pz)<4.6)continue;
    tree(parent,x,z,rr(0.8,1.25));
    placed++;
  }
  // أزهار
  const flowerG=new THREE.IcosahedronGeometry(0.15,0);
  for(let i=0;i<24;i++){
    const x=rr(-8.5,8.5),z=rr(-8.5,8.5);
    if(Math.abs(x)<1.5||Math.abs(z)<1.5||Math.hypot(x-px,z-pz)<3.4)continue;
    const f=new THREE.Mesh(flowerG,new THREE.MeshLambertMaterial({color:pick([0xff6b81,0xffd93d,0xffffff,0xc77dff])}));
    f.position.set(x,0.25,z);parent.add(f);
  }
  // مقاعد
  const benchM=new THREE.MeshLambertMaterial({color:0x8a5a32});
  [[-5,1.8,0],[5,1.8,0],[-5,-1.8,Math.PI],[5,-1.8,Math.PI]].forEach(([x,z,r])=>{
    const b=new THREE.Group();b.position.set(x,0.15,z);b.rotation.y=r;
    const seat=new THREE.Mesh(new THREE.BoxGeometry(2,0.15,0.6),benchM);seat.position.y=0.5;
    const back=new THREE.Mesh(new THREE.BoxGeometry(2,0.5,0.1),benchM);back.position.set(0,0.85,0.3);
    const l1=new THREE.Mesh(new THREE.BoxGeometry(0.12,0.5,0.5),benchM);l1.position.set(-0.85,0.25,0);
    const l2=l1.clone();l2.position.x=0.85;
    b.add(seat,back,l1,l2);parent.add(b);
  });
}

// ---------- أحياء المباني ----------
function townBlock(parent,dist){
  const boost=Math.max(0,1-dist/90);
  if(rand()<0.25){
    addBuilding(parent,0,0,rr(12,15),rr(12,15),rr(14,26)+boost*30,0,true);
  }else{
    for(const sx of [-1,1])for(const sz of [-1,1]){
      addBuilding(parent,sx*5,sz*5,rr(6.5,8.5),rr(6.5,8.5),rr(6,14)+boost*rr(0,32),0,rand()<0.5);
    }
  }
}

// ---------- أعمدة الإنارة ----------
const poleG=new THREE.CylinderGeometry(0.08,0.1,4,6),bulbG=new THREE.SphereGeometry(0.3,8,6);
const poleM=new THREE.MeshLambertMaterial({color:0x2b2f36});
function lamp(parent,x,z){
  const p=new THREE.Mesh(poleG,poleM);p.position.set(x,2,z);
  const b=new THREE.Mesh(bulbG,lampMat);b.position.set(x,4.1,z);
  parent.add(p,b);
}

// ---------- بناء الأحياء ----------
for(let i=0;i<N;i++)for(let j=0;j<N;j++){
  const cx=(i-(N-1)/2)*P,cz=(j-(N-1)/2)*P;
  const g=new THREE.Group();g.position.set(cx,0,cz);city.add(g);
  const base=new THREE.Mesh(new THREE.BoxGeometry(B,0.3,B),sidewalkM);
  base.position.y=0.15;base.receiveShadow=true;g.add(base);
  const inner=new THREE.Group();inner.position.y=0.3;g.add(inner);
  let type;
  if(i===2&&j===2)type='park';
  else{const r=rand();type=r<0.2?'park':r<0.42?'cafe':'town';}
  if(type==='park')parkBlock(inner);
  else if(type==='cafe')cafeBlock(inner);
  else townBlock(inner,Math.hypot(cx,cz));
  [[-9.4,-9.4],[9.4,-9.4],[-9.4,9.4],[9.4,9.4]].forEach(([x,z])=>lamp(inner,x,z));
}

// أشجار خارج المدينة
for(let i=0;i<70;i++){
  const a=rand()*Math.PI*2,r=rr(90,170);
  const x=Math.cos(a)*r,z=Math.sin(a)*r;
  if(Math.max(Math.abs(x),Math.abs(z))<82)continue;
  tree(scene,x,z,rr(1,1.8));
}

// ---------- مناطق الاصطدام (المباني والأشجار) ----------
scene.updateMatrixWorld(true);
const boxes=[],treeCols=[];
{
  const _b=new THREE.Box3(),_v=new THREE.Vector3();
  scene.traverse(n=>{
    if(n.userData.solid){_b.setFromObject(n);
      boxes.push({minx:_b.min.x,maxx:_b.max.x,minz:_b.min.z,maxz:_b.max.z});}
    else if(n.userData.tree){n.getWorldPosition(_v);
      treeCols.push({x:_v.x,z:_v.z,r:0.45*n.parent.scale.x});}
  });
}
function collide(p){
  const R=0.4;
  for(const b of boxes){
    const cx=clamp(p.x,b.minx,b.maxx),cz=clamp(p.z,b.minz,b.maxz);
    const dx=p.x-cx,dz=p.z-cz,d2=dx*dx+dz*dz;
    if(d2<R*R){
      if(d2>1e-8){const d=Math.sqrt(d2);p.x+=dx/d*(R-d);p.z+=dz/d*(R-d);}
      else{
        const l=p.x-b.minx,r=b.maxx-p.x,t=p.z-b.minz,bt=b.maxz-p.z,m=Math.min(l,r,t,bt);
        if(m===l)p.x=b.minx-R;else if(m===r)p.x=b.maxx+R;else if(m===t)p.z=b.minz-R;else p.z=b.maxz+R;
      }
    }
  }
  for(const c of treeCols){
    const dx=p.x-c.x,dz=p.z-c.z,d=Math.hypot(dx,dz),m=R+c.r;
    if(d<m&&d>1e-6){p.x+=dx/d*(m-d);p.z+=dz/d*(m-d);}
  }
  p.x=clamp(p.x,-95,95);p.z=clamp(p.z,-95,95);
}

// ---------- سيارات ----------
const carBodyG=new THREE.BoxGeometry(1.8,0.7,3.8),carCabG=new THREE.BoxGeometry(1.5,0.6,1.9),lightG=new THREE.BoxGeometry(0.35,0.2,0.1);
const carCols=[0xe74c3c,0x3498db,0xf1c40f,0xecf0f1,0x2ecc71,0x9b59b6,0xe67e22,0x34495e];
const cars=[];
for(let i=0;i<28;i++){
  const g=new THREE.Group();
  const b=new THREE.Mesh(carBodyG,new THREE.MeshLambertMaterial({color:pick(carCols)}));b.position.y=0.55;
  const c=new THREE.Mesh(carCabG,glassMat);c.position.set(0,1.2,-0.2);
  const l1=new THREE.Mesh(lightG,lampMat),l2=l1.clone();
  l1.position.set(-0.55,0.6,1.92);l2.position.set(0.55,0.6,1.92);
  b.castShadow=c.castShadow=true;
  g.add(b,c,l1,l2);scene.add(g);
  const axis=rand()<0.5?'x':'z',dir=rand()<0.5?1:-1,rc=pick(roadCenters);
  const line=axis==='x'?rc+dir*2:rc-dir*2;
  cars.push({g,axis,dir,line,pos:rr(-74,74),speed:rr(6,12)});
}

// ---------- سحب ----------
const cloudM=new THREE.MeshLambertMaterial({color:0xffffff,flatShading:true});
const clouds=[];
for(let i=0;i<10;i++){
  const c=new THREE.Group();
  for(let k=0;k<4;k++){
    const s=new THREE.Mesh(ballG,cloudM);
    s.scale.set(rr(2,3.5),rr(1,1.6),rr(2,3));
    s.position.set(k*3-4.5,rr(-0.5,0.5),rr(-1,1));c.add(s);
  }
  c.position.set(rr(-200,200),rr(70,100),rr(-150,150));scene.add(c);clouds.push(c);
}

// =====================================================
// ---------- الشخصية (بنت أصلية) ----------
// =====================================================
const girl=new THREE.Group();scene.add(girl);
const body=new THREE.Group();girl.add(body);
const MM=c=>new THREE.MeshLambertMaterial({color:c});
const skinM=MM(0xe8b894),jacketM=MM(0x1f9d9a),pantsM=MM(0x2d3748),shoeM=MM(0xf4f4f4);
const hairM=MM(0x2b1a12),darkM=MM(0x1a1a1a),lipM=MM(0xb5655f);
const hairMD=new THREE.MeshLambertMaterial({color:0x2b1a12,side:THREE.DoubleSide});
function part(geo,mat,x,y,z,parent){
  const m=new THREE.Mesh(geo,mat);m.position.set(x,y,z);m.castShadow=true;parent.add(m);return m;
}
// الجذع
part(new THREE.BoxGeometry(0.52,0.62,0.3),jacketM,0,1.27,0,body);
part(new THREE.BoxGeometry(0.5,0.22,0.3),pantsM,0,0.97,0,body);
part(new THREE.CylinderGeometry(0.07,0.08,0.12,8),skinM,0,1.62,0,body);
